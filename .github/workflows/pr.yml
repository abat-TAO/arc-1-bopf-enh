name: abaplint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # Only new findings of this pull request fail the check.
      - name: abaplint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes @abaplint/cli@2.120.68 --format checkstyle > abaplint.xml || true
          reviewdog -f=checkstyle -name=abaplint -reporter=github-pr-check \
            -filter-mode=added -fail-level=error < abaplint.xml

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arc1-extension
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run build

      - run: npm test

      # Loads the bundle with ARC-1's own plugin loader, without an SAP connection.
      - run: npm run tools
