name: abaplint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      # abaplint, in the version of the root package.json
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          # Not tracked by Dependabot; update by hand.
          reviewdog_version: v0.21.2

      # Only new findings of this pull request fail the check.
      - name: abaplint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --no -- abaplint --format checkstyle > abaplint.xml || true
          reviewdog -f=checkstyle -name=abaplint -reporter=github-pr-check \
            -filter-mode=added -fail-level=error < abaplint.xml

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arc1-extension
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run build

      - run: npm test

      # Loads the bundle with ARC-1's own plugin loader, without an SAP connection.
      - run: npm run tools
